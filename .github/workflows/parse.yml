name: parse-deals

# Сборщик скидок: по расписанию каждые 2 часа + вручную.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parse-deals
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r parser/requirements.txt

      - name: Run parsers
        run: python3 parser/run.py

      - name: Commit updated deals.json
        run: |
          git config user.name "chegirma-bot"
          git config user.email "bot@chegirma.uz"
          git add docs/deals.json
          if git diff --staged --quiet; then
            echo "Нет изменений в deals.json"
          else
            git commit -m "data: обновление скидок [skip ci]"
            git push
          fi
